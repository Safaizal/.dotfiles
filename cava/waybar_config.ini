[general]
framerate = 60
bars = 12
autosens = 0
sensitivity = 100
lower_cutoff_freq = 40
higher_cutoff_freq = 20000
bar_delimiter = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /tmp/cava.fifo
data_format = ascii
channels = stereo
ascii_max_range = 7

[smoothing]
monstercat = 0
waves = 0
noise_reduction = 90
gravity = 100
