"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─┤](#ffffff)\
[░▒▓](#000000)\
$os\
[](bg:#333333 fg:#000000)\
$directory\
[](fg:#333333 bg:#555555)\
$git_branch\
$git_status\
[](fg:#555555 bg:#777777)\
$nodejs\
$bun\
$rust\
$golang\
$php\
$python\
[](fg:#777777 bg:#999999)\
$time\
[ ](fg:#999999)\
\n$character"""

[directory]
style = "fg:#ffffff bg:#333333"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#555555"
format = '[[ $symbol $branch ](fg:#ffffff bg:#555555)]($style)'

[git_status]
style = "bg:#555555"
format = '[[($all_status$ahead_behind )](fg:#ffffff bg:#555555)]($style)'

[nodejs]
symbol = ""
style = "bg:#777777"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#777777)]($style)'

[bun]
symbol = ""
style = "bg:#777777"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#777777)]($style)'

[rust]
symbol = ""
style = "bg:#777777"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#777777)]($style)'

[golang]
symbol = ""
style = "bg:#777777"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#777777)]($style)'

[php]
symbol = ""
style = "bg:#777777"
format = '[[ $symbol ($version) ](fg:#ffffff bg:#777777)]($style)'

[python]
format = '[[ $symbol (\($virtualenv\)) ](fg:#ffffff bg:#777777)]($style)'
symbol = ''
pyenv_version_name = true

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#999999"
format = '[[  $time ](fg:#000000 bg:#999999)]($style)'

[os]
style = "bg:#000000 fg:#00ff11"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[character]
format = "[╰─](#ffffff)$symbol "
success_symbol = "[❯](#00ff11)"
error_symbol = "[❯](#ff0000)"
