$Weather = ~/.config/hypr/hyprlock/scripts/weather.sh

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    brightness = 0.8
}

# INPUT FIELD
input-field {
    monitor =
    size = 249, 60
    outline_thickness = 0
    outer_color = rgb(255, 255, 255)
    dots_size = 0.3
    dots_spacing = 1
    dots_center = true
    inner_color = rgb(0, 0, 0)
    font_family = JetBrainsMono Nerd Font Mono ExtraBold
    font_color = rgb(0, 255, 0)
    fade_on_empty = true
    placeholder_text = PASS >_<
    hide_input = false
    position = 0, -469
    halign = center
    valign = center
    zindex = 20
}

# TIME HH
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba(255, 255, 255, 1)
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 150
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -249
    halign = center
    valign = top
    zindex = 5
}

# TIME MM
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(255, 255, 255, 1)
    font_size = 150
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -420
    halign = center
    valign = top
    zindex = 5
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = rgba(255, 255, 255, 1)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, -129
    halign = center
    valign = center
    zindex = 5
}

# USER-BOX
shape {
    monitor =
    size = 249, 60
    color = rgba(255, 255, 255, 0.1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false
    position = 0, -399
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = rgb(255, 255, 255)
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 20
    font_family = JetBrainsMono Nerd Font Mono Bold
    position = 0, -399
    halign = center
    valign = center
}

# WEATHER
label {
    monitor =
    text = cmd[update:1000] $Weather
    color = rgb(255, 255, 255)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 39, -18
    halign = left
    valign = top
    zindex = 5
}

# Battery bg
shape {
    monitor =
    size = 79, 32
    color = rgba(0, 0, 0, 0.5)
    rounding = 20
    rotate = 0
    position = -39, -18
    halign = right
    valign = top
    zindex = 1
}

# Battery
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(255, 255, 255)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = -39, -18
    halign = right
    valign = top
    zindex = 5
}

# Avatar
image {
    monitor =
    path = ~/.face/araragi.jpg
    size = 119
    rounding = -1
    border_size = 4
    border_color = rgb(221, 221, 221)
    rotate = 0
    reload_time = -1
    position = 0, -290
    halign = center
    valign = center
}
